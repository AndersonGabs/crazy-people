<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre na sua conta - A rede social que te leva a loucura!</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="grid-vertical">
        <div class="container-content">
            <h1 class="title"> Bem Vindo de Volta </br> à Loucura! </h1>
            <form id="form-login" onsubmit="return false" method="post" class="form-center">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="email" placeholder="email">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-password">
                        <input type="password" name="password" id="password">
                        <i class="fa-regular fa-eye icon-eye"></i>
                        <!--<i class="fa-regular fa-eye-slash"></i>!-->
                    </div>
                </div>
                <div class="tips">
                    <div class="tip">
                        <div class="tip-icon success" id="error-uppercase"></div>
                        <div class="tip-text">Uma letra maiúscula</div>
                    </div>
                    <div class="tip">
                        <div class="tip-icon error" id="error-number"></div>
                        <div class="tip-text">um número</div>
                    </div>
                    <div class="tip">
                        <div class="tip-icon success" id="error-lowercase"></div>
                        <div class="tip-text">uma letra minúscula</div>
                    </div>
                    <div class="tip">
                        <div class="tip-icon success" id="error-minlength"></div>
                        <div class="tip-text">no mínimo 8 caracteres</div>
                    </div>
                </div>
                <div class="center">
                    <a href="recover-password.html" class="general">Esqueci minha senha</a>
                </div>
            </form>
        </div>
        <div class=" group-buttons">
            <a class="button button-primary">Cadastrar</a>
            <a class="button button-cancel" href="../index.html">Cancelar</a>
        </div>
    </div>
</body>

</html>
